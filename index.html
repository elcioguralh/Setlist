<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Setlist Palco</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0a0a0a; --fg:#f2f0ea; --dim:#8a8880; --accent:#ffb100;
    --line:#28251f; --card:#151310; --danger:#ff4d4d; --radius:10px;
    --stage-fs:40px; --cifra-fs:28px; --ui-fs:17px;
    --stage-title-fs:26px; --stage-list-fs:16px; --stage-tone-fs:19px; --stage-notes-fs:15px;
  }
  html[data-theme="mono"]{
    --bg:#000000; --fg:#ffffff; --dim:#8f8f8f;
    --accent:#ffffff; --line:#2a2a2a; --card:#0d0d0d; --danger:#ffffff;
  }
  html[data-theme="monolight"]{
    --bg:#ffffff; --fg:#0a0a0a; --dim:#5c5c5c;
    --accent:#000000; --line:#dcdcdc; --card:#f3f3f1; --danger:#000000;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:var(--ui-fs); line-height:1.4;
    display:flex; flex-direction:column; height:100vh; height:100dvh;
    user-select:none;
  }
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(8px + env(safe-area-inset-top)) 16px 8px 16px;
    border-bottom:1px solid var(--line); flex-shrink:0; gap:8px;
  }
  #topbar h1{
    font-size:18px; font-weight:800; letter-spacing:-0.02em; margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .btn{
    background:none; border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:8px 12px; font-size:15px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .btn:active{ background:var(--card); }
  .btn.primary{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .btn.ghost{ border-color:transparent; padding:8px; }
  .btn.danger{ color:var(--danger); border-color:var(--danger); }
  .btn.small{ padding:5px 9px; font-size:12px; }
  .btn.active{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .fontBtn{ font-weight:800; min-width:36px; }
  .topbtns{ display:flex; gap:6px; flex-shrink:0; }
  #screen{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .empty{ padding:40px 24px calc(40px + env(safe-area-inset-bottom)) 24px; color:var(--dim); text-align:center; }
  .empty b{ color:var(--fg); display:block; margin-bottom:6px; font-size:17px; }

  /* Lists */
  .rowlist{ display:flex; flex-direction:column; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  .row{
    display:flex; align-items:center; gap:12px;
    padding:16px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .row:active{ background:var(--card); }
  .row .idx{ color:var(--dim); font-variant-numeric:tabular-nums; width:26px; flex-shrink:0; font-size:15px; }
  .row .info{ flex:1; min-width:0; }
  .row .info .t{ font-weight:700; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .info .a{ color:var(--dim); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .row .meta{ color:var(--dim); font-size:13px; flex-shrink:0; text-align:right; }
  .row .actions{ display:flex; gap:4px; flex-shrink:0; }
  .row.selected{ background:var(--card); box-shadow:inset 3px 0 0 var(--accent); }
  .dragHandle{ color:var(--dim); font-size:20px; padding:4px 6px; touch-action:none; cursor:grab; flex-shrink:0; }
  .row.dragging{ opacity:0.55; box-shadow:0 4px 14px rgba(0,0,0,0.4); background:var(--card); }
  .row.dragging .dragHandle{ cursor:grabbing; }
  .checkCircle{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--line);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:13px; font-weight:900;
  }
  .checkCircle.on{ background:var(--accent); border-color:var(--accent); }
  .selectBar{
    position:sticky; bottom:0; display:flex; align-items:center; gap:8px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)) 16px;
    background:var(--bg); border-top:1px solid var(--line);
  }
  .selectBar span{ color:var(--dim); font-size:13px; flex-shrink:0; }
  .selectBar .btn{ flex:1; }
  .pickList{ display:flex; flex-direction:column; gap:6px; max-height:50vh; overflow-y:auto; }
  .pickList .btn{ width:100%; text-align:left; justify-content:flex-start; }
  .sheetWrap{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .sheetFrame{ width:100%; height:100%; border:none; background:#fff; }
  .sheetImg{ max-width:100%; max-height:100%; object-fit:contain; }
  .wakeDot{ display:inline-flex; align-items:center; justify-content:center; width:30px; font-size:15px; flex-shrink:0; }

  .fab-row{ display:flex; gap:8px; padding:16px; flex-wrap:wrap; }

  /* Forms */
  .form{ padding:16px 16px calc(20px + env(safe-area-inset-bottom)) 16px; display:flex; flex-direction:column; gap:14px; }
  .field label{ display:block; font-size:13px; color:var(--dim); margin-bottom:6px; font-weight:600; }
  .field input, .field textarea, .field select{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:11px 12px; font-size:16px; font-family:inherit;
  }
  .field select{ -webkit-appearance:none; appearance:none; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field textarea.lyrics{ min-height:220px; font-size:15px; line-height:1.6; }
  .field textarea.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .hint{ color:var(--dim); font-size:13px; margin-top:-4px; }

  /* Stage view */
  #stageScreen{ display:flex; flex-direction:column; height:100%; }
  .stagelist{ flex:1; overflow-y:auto; padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  .stagerow{
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:5px;
  }
  .stagerow .main{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .stagerow .idx{ color:var(--dim); font-size:var(--stage-list-fs); width:24px; flex-shrink:0; }
  .stagerow .t{ font-size:var(--stage-title-fs); font-weight:800; flex:1; min-width:120px; overflow-wrap:break-word; }
  .stagerow .a{ color:var(--dim); font-size:var(--stage-list-fs); overflow-wrap:break-word; }
  .stagerow .tone{
    color:var(--bg); background:var(--accent); font-weight:800; font-size:var(--stage-tone-fs);
    flex-shrink:0; padding:1px 10px; border-radius:6px; line-height:1.35;
  }
  .stagerow .extra{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    padding-left:36px; font-size:var(--stage-notes-fs); color:var(--dim);
  }
  .stagerow .extra .bpm{ flex-shrink:0; }
  .stagerow .extra .notes{ color:var(--fg); opacity:0.85; overflow-wrap:break-word; }
  .stagerow.current{ background:var(--card); box-shadow:inset 5px 0 0 var(--accent); }
  .stagerow.current .t{ color:var(--accent); }

  /* Lyrics / Cifra view */
  #lyricsScreen{ display:flex; flex-direction:column; height:100%; }
  .lyrheader{ padding:6px 16px; border-bottom:1px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .lyrheader .info{ min-width:0; flex:1; }
  .titleRow{ display:flex; align-items:center; gap:8px; }
  .lyrheader .t{ font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .lyrheader .sub{ color:var(--dim); font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toneBadge{
    color:var(--bg); background:var(--accent); font-weight:800; font-size:var(--stage-tone-fs);
    padding:1px 10px; border-radius:6px; flex-shrink:0; line-height:1.35;
  }
  .modeToggle{ display:flex; gap:4px; flex-shrink:0; }
  .lyrbody{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:14px 24px; position:relative; overflow:hidden;
  }
  .lyrbody .lines{ font-size:var(--stage-fs); font-weight:700; line-height:1.5; letter-spacing:-0.01em; max-width:900px; overflow-wrap:break-word; }
  .lyrbody .lines div{ margin:0.15em 0; }
  .lyrbody .cifra-lines{
    font-size:var(--cifra-fs); font-weight:700; line-height:1.45; font-family:ui-monospace,Menlo,Consolas,monospace;
    white-space:pre; text-align:left; max-width:100%; overflow:auto;
  }
  .hl{ color:var(--accent); font-weight:900; }
  .lyrbody .zone{ position:absolute; top:0; bottom:0; width:50%; }
  .lyrbody .zone.left{ left:0; } .lyrbody .zone.right{ right:0; }
  .lyrfooter{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:2px 16px calc(2px + env(safe-area-inset-bottom)) 16px;
    border-top:1px solid var(--line); flex-shrink:0; color:var(--dim); font-size:10px;
  }
  .lyrfooter-left{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .dots{ display:flex; gap:3px; }
  .dot{ width:4px; height:4px; border-radius:50%; background:var(--line); }
  .dot.on{ background:var(--accent); }
  .nextup{
    font-size:18px; font-weight:800; color:var(--accent); text-align:right;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1;
  }
  .nextup.dim{ color:var(--dim); font-weight:600; font-size:10px; }
  .noLyrics{ color:var(--dim); font-size:20px; text-align:center; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet{
    background:var(--bg); border:1px solid var(--line); border-radius:16px 16px 0 0;
    width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)) 16px;
  }
  .sheet h2{ margin:0 0 14px 0; font-size:18px; }
  .sheet h3{ margin:18px 0 4px 0; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:0.03em; }
  .sheet-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap; }
  .sheet-row:last-child{ border-bottom:none; }
  .sheet-row.stack{ flex-direction:column; align-items:stretch; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{ width:34px; height:34px; border-radius:8px; flex-shrink:0; }
  .kbd{ display:inline-block; background:var(--card); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px; font-family:monospace; }
  .backupBtns{ display:flex; gap:8px; flex-wrap:wrap; }
  .backupBtns .btn{ flex:1; min-width:130px; }
  .syncBannerBox{ background:var(--card); border-bottom:1px solid var(--accent); padding:10px 16px; font-size:13px; display:flex; flex-direction:column; gap:8px; }
  .syncBannerBox .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .syncBannerBox .row .btn{ flex:1; min-width:110px; }

  /* Responsive: landscape / very short viewports */
  @media (orientation:landscape) and (max-height:480px){
    #topbar{ padding-top:4px; padding-bottom:4px; }
    #topbar h1{ font-size:14px; }
    .stagerow{ padding:6px 16px; gap:2px; }
    .stagerow .extra{ padding-left:0; }
    .lyrheader{ padding:3px 16px; }
    .lyrheader .t{ font-size:13px; }
    .lyrheader .sub{ font-size:10px; }
    .lyrbody{ padding:4px 20px; }
    .lyrfooter{ padding:1px 16px; }
    .nextup{ font-size:16px; }
    .lyrbody .lines{ line-height:1.2; }
  }
  /* Responsive: wide screens (tablet / PC) */
  @media (min-width:680px){
    .form, .rowlist, .fab-row{ max-width:640px; margin:0 auto; width:100%; }
    .lyrbody .lines{ max-width:920px; }
    .lyrbody .cifra-lines{ max-width:920px; }
    .stagelist{ max-width:820px; margin:0 auto; width:100%; }
  }
</style>
</head>
<body>
<div id="topbar">
  <div class="topbtns" id="leftBtns"></div>
  <h1 id="title">Setlist Palco</h1>
  <div class="topbtns" id="rightBtns"></div>
</div>
<div id="syncBanner"></div>
<main id="screen"></main>

<script>
/* ---------------- DATA LAYER ---------------- */
const DB_KEY = 'setlistpalco_db_v1';
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function defaultSettings(){
  return {
    theme:'dark',
    linesPerPage:3, fontSize:'md',
    chordFontSize:'md', chordFitPage:false,
    stageFontSize:{ title:'md', list:'md', tone:'md', notes:'md' }
  };
}
function defaultDB(){
  return { setlists: [], songs: {}, settings: defaultSettings(), activeSetlistId:null };
}
let db = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultDB(), parsed);
    const ds = defaultSettings();
    merged.settings = Object.assign({}, ds, parsed.settings||{});
    merged.settings.stageFontSize = Object.assign({}, ds.stageFontSize, (parsed.settings&&parsed.settings.stageFontSize)||{});
    return merged;
  }catch(e){ return defaultDB(); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

/* ---------------- SYNC (GitHub, opt-in, per device) ----------------
   Design goals:
   - Never blocks or risks the offline/on-stage experience: every network call
     is wrapped so a failure (no internet, GitHub down, bad token) just gets
     skipped silently in the background (auto mode) — the app keeps working
     off local data exactly as before.
   - Only setlists+songs are synced (not display preferences like theme/font,
     which can reasonably differ per device).
   - "Safe" pulls/pushes (only one side changed since the last sync) happen
     automatically. If BOTH sides changed, nothing is auto-applied — a banner
     asks the person to choose, so nothing is silently overwritten.
   - Never auto-applies a remote update while on the Stage or Lyrics screen,
     so a background sync can't change what's on screen mid-performance; it's
     queued and applied only once the person navigates back out.
*/
const SYNC_META_KEY = 'setlistpalco_sync_meta_v1';
function defaultSyncMeta(){
  return { token:'', repo:'', path:'setlist-data.json', lastSyncedAt:0, lastLocalChangeAt:0, remoteSha:'' };
}
function loadSyncMeta(){
  try{
    const raw = localStorage.getItem(SYNC_META_KEY);
    if(!raw) return defaultSyncMeta();
    return Object.assign(defaultSyncMeta(), JSON.parse(raw));
  }catch(e){ return defaultSyncMeta(); }
}
function saveSyncMeta(m){ localStorage.setItem(SYNC_META_KEY, JSON.stringify(m)); }
// Marks that setlists/songs changed locally, so the next sync knows this
// device has something to push (or to flag as a conflict). Never called for
// display-only settings (theme, font sizes, etc.) — those aren't synced.
function touchContent(){
  const m = loadSyncMeta();
  m.lastLocalChangeAt = Date.now();
  saveSyncMeta(m);
}

function base64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function base64DecodeUtf8(b64){ return decodeURIComponent(escape(atob(b64))); }

async function githubGetFile(meta){
  const url = 'https://api.github.com/repos/'+meta.repo+'/contents/'+meta.path;
  const resp = await fetch(url, { headers:{
    'Authorization':'Bearer '+meta.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  }});
  if(resp.status===404) return null;
  if(!resp.ok) throw new Error('GitHub respondeu '+resp.status);
  const json = await resp.json();
  const content = base64DecodeUtf8((json.content||'').replace(/\n/g,''));
  let data;
  try{ data = JSON.parse(content); } catch(e){ throw new Error('Arquivo remoto inválido'); }
  return { data, sha: json.sha };
}
async function githubPutFile(meta, payload, sha){
  const url = 'https://api.github.com/repos/'+meta.repo+'/contents/'+meta.path;
  const body = {
    message: 'Sincronizar setlist ('+new Date().toLocaleString('pt-BR')+')',
    content: base64EncodeUtf8(JSON.stringify(payload))
  };
  if(sha) body.sha = sha;
  const resp = await fetch(url, {
    method:'PUT',
    headers:{
      'Authorization':'Bearer '+meta.token,
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28',
      'Content-Type':'application/json'
    },
    body: JSON.stringify(body)
  });
  if(!resp.ok){
    const t = await resp.text().catch(()=> '');
    throw new Error('GitHub respondeu '+resp.status+(t?(': '+t.slice(0,140)):''));
  }
  const json = await resp.json();
  return { sha: json.content.sha };
}

let syncBusy = false;
let pendingRemoteApply = null; // set when a safe auto-pull is ready but the person is on Stage/Lyrics

async function runSync(manual){
  if(syncBusy) return;
  const meta = loadSyncMeta();
  if(!meta.token || !meta.repo){
    if(manual) alert('Configure o token e o repositório de sincronização primeiro, em Ajustes.');
    return;
  }
  if(!navigator.onLine){
    if(manual) alert('Sem internet no momento — tente novamente quando estiver conectado.');
    return;
  }
  syncBusy = true;
  try{
    const remote = await githubGetFile(meta);
    if(remote === null){
      // nothing saved on GitHub yet — safe to push this device's data as the first version
      await pushLocalData(meta, null);
      if(manual) alert('Sincronizado! Esta é a primeira versão salva no GitHub.');
    } else {
      const remoteUpdatedAt = remote.data.updatedAt || 0;
      const localSyncedAt = meta.lastSyncedAt || 0;
      const localChangedAt = meta.lastLocalChangeAt || 0;
      const remoteChanged = remoteUpdatedAt > localSyncedAt;
      const localChanged = localChangedAt > localSyncedAt;

      if(!remoteChanged && !localChanged){
        if(manual) alert('Já está tudo sincronizado.');
      } else if(remoteChanged && !localChanged){
        if(state.view==='stage' || state.view==='lyrics'){
          pendingRemoteApply = { data:remote.data, sha:remote.sha };
          if(manual) alert('Encontrei uma versão mais nova — será aplicada assim que você sair do modo Palco/Letra.');
        } else {
          applyRemoteData(remote.data, remote.sha);
          if(manual) alert('Sincronizado! Trouxe a versão mais nova do GitHub.');
        }
      } else if(!remoteChanged && localChanged){
        await pushLocalData(meta, remote.sha);
        if(manual) alert('Sincronizado! Suas mudanças foram enviadas para o GitHub.');
      } else {
        showConflictBanner({ data:remote.data, sha:remote.sha });
        if(manual) alert('Há mudanças dos dois lados — escolha o que fazer na faixa que apareceu no topo da tela.');
      }
    }
  }catch(err){
    if(manual) alert('Não consegui sincronizar agora: '+(err&&err.message?err.message:'erro desconhecido'));
  } finally {
    syncBusy = false;
  }
}
function applyRemoteData(data, sha){
  db.setlists = data.setlists || [];
  db.songs = {};
  Object.keys(data.songs||{}).forEach(sid=>{
    db.songs[sid] = Object.assign(blankSong(), {id:sid}, data.songs[sid]);
  });
  saveDB();
  const m = loadSyncMeta();
  const ts = data.updatedAt || Date.now();
  m.lastSyncedAt = ts; m.lastLocalChangeAt = ts; m.remoteSha = sha;
  saveSyncMeta(m);
  if(state.view!=='stage' && state.view!=='lyrics') render();
}
async function pushLocalData(meta, sha){
  const now = Date.now();
  const payload = { setlists: db.setlists, songs: db.songs, updatedAt: now };
  const result = await githubPutFile(meta, payload, sha);
  const m = loadSyncMeta();
  m.lastSyncedAt = now; m.lastLocalChangeAt = now; m.remoteSha = result.sha;
  saveSyncMeta(m);
}
let activeConflict = null;
function showConflictBanner(conflict){
  activeConflict = conflict;
  const el = document.getElementById('syncBanner');
  if(!el) return;
  el.innerHTML = `<div class="syncBannerBox">
    <div>Encontrei uma versão diferente no GitHub, e este aparelho também tem mudanças ainda não sincronizadas. O que deseja fazer?</div>
    <div class="row">
      <button class="btn small primary" onclick="resolveConflict('push')">Enviar a daqui</button>
      <button class="btn small" onclick="resolveConflict('pull')">Usar a do GitHub</button>
      <button class="btn small ghost" onclick="dismissConflictBanner()">Agora não</button>
    </div>
  </div>`;
}
function dismissConflictBanner(){
  activeConflict = null;
  const el = document.getElementById('syncBanner');
  if(el) el.innerHTML = '';
}
async function resolveConflict(choice){
  if(!activeConflict) return;
  const meta = loadSyncMeta();
  try{
    if(choice==='push'){ await pushLocalData(meta, activeConflict.sha); }
    else { applyRemoteData(activeConflict.data, activeConflict.sha); }
  }catch(err){
    alert('Não consegui concluir: '+(err&&err.message?err.message:'erro desconhecido'));
    return;
  }
  dismissConflictBanner();
}
function formatRelative(ts){
  if(!ts) return '';
  const diff = Math.max(0, Date.now()-ts);
  const min = Math.floor(diff/60000);
  if(min<1) return 'agora mesmo';
  if(min<60) return 'há '+min+' min';
  const h = Math.floor(min/60);
  if(h<24) return 'há '+h+'h';
  const d = Math.floor(h/24);
  return 'há '+d+' dia'+(d>1?'s':'');

/* ---------------- SHEET MUSIC FILES (IndexedDB) ----------------
   Only the binary files (PDF/image) live here — completely separate from the
   main localStorage-based db (setlists/songs/settings), which is untouched.
   The song object only keeps lightweight metadata (sheetMusicName/Type); the
   actual file blob is stored in IndexedDB keyed by the song's own id. This
   keeps the well-tested existing save/load flow at zero risk, and keeps the
   GitHub sync payload (text only) small — sheet music files are NOT synced
   automatically between devices; each device needs its own file attached.
*/
const IDB_NAME = 'setlistpalco_files';
const IDB_STORE = 'sheetmusic';
let idbPromise = null;
function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB indisponível neste navegador')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return idbPromise;
}
async function idbPutSheetMusic(songId, record){
  const conn = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = conn.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(record, songId);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetSheetMusic(songId){
  const conn = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = conn.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(songId);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbDeleteSheetMusic(songId){
  const conn = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = conn.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(songId);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

/* ---------------- SCREEN WAKE LOCK ----------------
   Ties to the performance session (Stage + Lyrics views), requested via goTo()
   below. Fails silently and shows a one-time discreet banner if unsupported
   or blocked — never breaks the app either way.
*/
let wakeLockSentinel = null;
const wakeLockSupported = (typeof navigator!=='undefined' && 'wakeLock' in navigator);
let wakeLockWarned = false;
async function requestWakeLock(){
  if(!wakeLockSupported){
    if(!wakeLockWarned){ wakeLockWarned = true; showWakeLockHint(); }
    return;
  }
  try{
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    wakeLockSentinel.addEventListener('release', ()=>{ wakeLockSentinel = null; updateWakeLockIndicator(); });
    updateWakeLockIndicator();
  }catch(err){
    wakeLockSentinel = null;
    updateWakeLockIndicator();
    if(!wakeLockWarned){ wakeLockWarned = true; showWakeLockHint(); }
  }
}
function releaseWakeLock(){
  if(wakeLockSentinel){
    wakeLockSentinel.release().catch(()=>{});
    wakeLockSentinel = null;
  }
  updateWakeLockIndicator();
}
if(typeof document!=='undefined'){
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && (state.view==='stage'||state.view==='lyrics') && !wakeLockSentinel){
      requestWakeLock();
    }
  });
}
function updateWakeLockIndicator(){
  const el = document.getElementById('wakeLockDot');
  if(!el) return;
  el.textContent = wakeLockSentinel ? '👁' : '';
  el.title = wakeLockSentinel ? 'Tela sempre ativa' : '';
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Converts raw multi-line text into an array of per-line HTML strings, escaping
// each line and turning **destaque** into <strong class="hl">. Unlike a naive
// per-line regex, this tracks the bold state ACROSS line breaks: if you open **
// on one line and close it several lines later, every line in between is bold
// too (each line's own HTML stays valid/self-closed; the state just carries over
// to the next line's opening tag).
function processedLines(rawText, trimMode){
  const raw = (rawText||'').split('\n');
  let bold = false;
  const html = raw.map(rawLine=>{
    const line = trimMode==='trim' ? rawLine.trim() : rawLine.replace(/\s+$/,'');
    const e = esc(line);
    let out = bold ? '<strong class="hl">' : '';
    let i = 0;
    while(i < e.length){
      if(e.slice(i,i+2)==='**'){
        bold = !bold;
        out += bold ? '<strong class="hl">' : '</strong>';
        i += 2;
      } else {
        out += e[i]; i++;
      }
    }
    if(bold) out += '</strong>'; // keep this line's HTML self-contained; reopened on the next line
    return out;
  });
  // trim trailing blank lines (based on the actual trimmed raw content, not the html)
  while(html.length){
    const idx = html.length-1;
    const rawTrim = trimMode==='trim' ? raw[idx].trim() : raw[idx].replace(/\s+$/,'');
    if(rawTrim==='') html.pop(); else break;
  }
  return html;
}

// Drag-to-reorder: press-and-hold the ⠿ handle (works for mouse and touch via
// Pointer Events) and drag up/down to reposition. The arrow buttons keep
// working exactly as before as an alternative.
function attachDragHandlers(sl){
  const container = document.getElementById('rowlist');
  if(!container) return;
  container.querySelectorAll('.dragHandle').forEach(handle=>{
    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      const row = handle.closest('.row');
      if(!row) return;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      row.classList.add('dragging');
      const onMove = (ev)=>{
        const rows = [...container.querySelectorAll('.row')];
        const y = ev.clientY;
        for(const r of rows){
          if(r===row) continue;
          const rect = r.getBoundingClientRect();
          const mid = rect.top + rect.height/2;
          if(y < mid && r.previousElementSibling===row){ container.insertBefore(row, r); break; }
          if(y > mid && r.nextElementSibling===row){ container.insertBefore(row, r.nextElementSibling); break; }
        }
      };
      const onUp = ()=>{
        row.classList.remove('dragging');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        const newOrder = [...container.querySelectorAll('.row')].map(r=>r.dataset.songid);
        sl.songs = newOrder;
        saveDB(); touchContent(); render();
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  });
}

function moveSong(slId, i, dir){

    ${state.editingSongId ? `<button class="btn danger" onclick="deleteSongFromLibrary()">Excluir música</button>` : ''}
  </div>`;
}
async function saveSongForm(){
  const title = document.getElementById('f_title').value.trim();
  if(!title){ alert('Digite o título da música.'); return; }
  const data = {
    title,
    artist: document.getElementById('f_artist').value.trim(),
    tone: document.getElementById('f_tone').value.trim(),
    bpm: document.getElementById('f_bpm').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    lyrics: document.getElementById('f_lyrics').value,
    align: document.getElementById('f_align').value,
    cifra: document.getElementById('f_cifra').value
  };
  let id = state.editingSongId;
  if(id){ db.songs[id] = Object.assign(blankSong(), db.songs[id], data); }
  else {
    id = uid();
    db.songs[id] = Object.assign(blankSong(), {id}, data);
    const sl = db.setlists.find(s=>s.id===state.setlistId);
    if(sl) sl.songs.push(id);
  }

  const fileInput = document.getElementById('f_sheet');
  const file = fileInput && fileInput.files[0];
  if(file){
    if(file.size > 15*1024*1024 && !confirm('Esse arquivo é bem grande ('+Math.round(file.size/1024/1024)+'MB) e pode demorar pra carregar no show. Continuar mesmo assim?')) {
      // keep the song saved, just skip attaching the file
    } else {
      try{
        const type = file.type==='application/pdf' ? 'pdf' : 'image';
        await idbPutSheetMusic(id, { type, mime:file.type, blob:file });
        db.songs[id].sheetMusicName = file.name;
        db.songs[id].sheetMusicType = type;
      }catch(err){
        alert('Não consegui salvar a partitura: '+(err&&err.message?err.message:'erro desconhecido'));
      }
    }
  }

  saveDB();
  touchContent();
  goTo('setlist');
}
function removeSheetMusic(){
  const id = state.editingSongId; if(!id) return;
  if(!confirm('Remover a partitura desta música?')) return;
  idbDeleteSheetMusic(id).catch(()=>{});
  db.songs[id].sheetMusicName = '';
  db.songs[id].sheetMusicType = '';
  saveDB(); touchContent();
  renderSongEdit();
}
function deleteSongFromLibrary(){
  if(!confirm('Excluir esta música da biblioteca? Ela será removida de todos os setlists.')) return;
  const id = state.editingSongId;
  delete db.songs[id];
  db.setlists.forEach(sl=>{ sl.songs = sl.songs.filter(sid=>sid!==id); });
  idbDeleteSheetMusic(id).catch(()=>{});
  saveDB();
  touchContent();
  goTo('setlist');
}

/* ---------------- PASTE FROM SPOTIFY ---------------- */
function renderPaste(){
  document.getElementById('screen').innerHTML = `<div class="form">
    <div class="field">
      <label>Cole aqui a lista copiada do Spotify (ou qualquer lista de músicas, uma por linha)</label>
      <textarea id="pasteBox" class="lyrics" placeholder="No Spotify: selecione as músicas da playlist, clique com o botão direito &gt; Copiar. Depois cole aqui."></textarea>
    </div>
    <div class="hint">Cada linha vira uma música. Se a linha tiver "Título - Artista" ou vier separada por tabulação (como o Spotify copia), o app separa título e artista automaticamente.</div>
  </div>`;
}
function processPaste(){
  const raw = document.getElementById('pasteBox').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0){ alert('Cole ao menos uma linha.'); return; }
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  let added = 0;
  lines.forEach(line=>{
    if(/^#?\s*(title|título|artista|album|álbum|duration|duração)\s*$/i.test(line)) return;
    let title, artist='';
    if(line.includes('\t')){
      const parts = line.split('\t').map(p=>p.trim()).filter(Boolean);
      title = parts[0]; artist = parts[1] || '';
    } else if(line.includes(' - ')){
      const idx = line.indexOf(' - ');
      title = line.slice(0, idx).trim();
      artist = line.slice(idx+3).trim();
    } else if(line.includes(' – ')){
      const idx = line.indexOf(' – ');
      title = line.slice(0, idx).trim();
      artist = line.slice(idx+3).trim();
    } else {
      title = line;
    }
    if(!title) return;
    const id = uid();
    db.songs[id] = Object.assign(blankSong(), { id, title, artist });
    sl.songs.push(id);
    added++;
  });
  saveDB();
  touchContent();
  goTo('setlist');
  setTimeout(()=>{ if(added) alert(added+' música(s) adicionada(s). Abra cada uma para colar a letra, se quiser.'); }, 50);
}

/* ---------------- LYRICS / CIFRA / PARTITURA VIEW ---------------- */
function enterLyrics(){
  state.lyricsChunk=0;
  const song = currentSongForSetlist();
  if(song){
    if(song.lyrics) state.lyricsMode='letra';
    else if(song.cifra) state.lyricsMode='cifra';
    else if(song.sheetMusicName) state.lyricsMode='partitura';
    else state.lyricsMode='letra';
  } else state.lyricsMode='letra';
  goTo('lyrics');
}
function exitLyrics(){ goTo('stage'); }
function currentSongForSetlist(){
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  if(!sl) return null;
  return db.songs[sl.songs[state.stageIndex]];
}
function currentSong(){ return currentSongForSetlist(); }

// Letra: each line trimmed (normal lyric formatting); blank trailing lines collapsed.
function lyricsChunks(song){
  const linesHtml = processedLines(song.lyrics, 'trim');
  if(linesHtml.length===0) return [];
  const perPage = db.settings.linesPerPage || 3;
  const chunks = [];
  for(let i=0;i<linesHtml.length;i+=perPage) chunks.push(linesHtml.slice(i,i+perPage));
  return chunks;
}
// Cifra: only trailing whitespace per line is trimmed — leading/internal spaces are
// preserved exactly as pasted, since that's what keeps chords aligned over the lyrics.
// If "página inteira" is on, the whole cifra is returned as a single chunk (no paging).
function chordChunks(song){
  const linesHtml = processedLines(song.cifra, 'trailing');
  if(linesHtml.length===0) return [];
  if(db.settings.chordFitPage) return [linesHtml];
  const perPage = db.settings.linesPerPage || 3;
  const chunks = [];
  for(let i=0;i<linesHtml.length;i+=perPage) chunks.push(linesHtml.slice(i,i+perPage));
  return chunks;
}
// Partitura has no line-pagination concept — it's a single "page" per song
// (like Cifra's "página inteira"), so pedal next/prev jumps straight to the
// next/previous song once you're viewing it.
function activeChunks(song){
  if(state.lyricsMode==='cifra') return chordChunks(song);
  if(state.lyricsMode==='partitura') return song.sheetMusicName ? [[1]] : [];
  return lyricsChunks(song);
}

let currentSheetBlobUrl = null;
function revokeSheetBlobUrl(){
  if(currentSheetBlobUrl){ URL.revokeObjectURL(currentSheetBlobUrl); currentSheetBlobUrl = null; }
}
function setLyricsMode(mode){
  if(state.lyricsMode===mode) return;
  if(state.lyricsMode==='partitura') revokeSheetBlobUrl();
  state.lyricsMode = mode; state.lyricsChunk = 0; render();
}
const FONT_OVERRIDE_LABELS = { '':'A', sm:'A⁻', lg:'A⁺', xl:'A⁺⁺' };
function fontBadgeLabel(song){ return FONT_OVERRIDE_LABELS[song.fontOverride||''] || 'A'; }
function cycleSongFontSize(){
  const song = currentSong(); if(!song) return;
  const order = ['','sm','lg','xl'];
  const cur = song.fontOverride || '';
  song.fontOverride = order[(order.indexOf(cur)+1)%order.length];
  saveDB(); touchContent(); render();
}

function renderLyrics(){
  const song = currentSong();
  const el = document.getElementById('screen');
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  if(!song){ el.innerHTML=`<div class="empty">Música não encontrada.</div>`; return; }

  const hasLyrics = !!(song.lyrics && song.lyrics.trim());
  const hasCifra = !!(song.cifra && song.cifra.trim());
  const hasSheet = !!song.sheetMusicName;
  const chunks = activeChunks(song);
  state.lyricsChunk = Math.max(0, Math.min(state.lyricsChunk, Math.max(chunks.length-1,0)));
  const posLabel = `${state.stageIndex+1}/${sl.songs.length}`;

  let body;
  if(state.lyricsMode==='partitura'){
    body = hasSheet
      ? `<div class="sheetWrap" id="sheetWrap"><div class="noLyrics">Carregando partitura…</div></div>`
      : `<div class="noLyrics">Sem partitura cadastrada para esta música.${song.notes?`<br><br><span style="font-size:16px">${esc(song.notes)}</span>`:''}</div>`;
  } else if(chunks.length===0){
    const msg = state.lyricsMode==='cifra' ? 'Sem cifra cadastrada para esta música.' : 'Sem letra cadastrada para esta música.';
    body = `<div class="noLyrics">${msg}${song.notes?`<br><br><span style="font-size:16px">${esc(song.notes)}</span>`:''}</div>`;
  } else if(state.lyricsMode==='cifra'){
    const c = chunks[state.lyricsChunk];
    const cfsOverride = (!db.settings.chordFitPage && song.fontOverride) ? CIFRA_FS_MAP[song.fontOverride] : '';
    body = `<div class="cifra-lines" style="${cfsOverride?('font-size:'+cfsOverride+';'):''}">${c.map(h=>h||'&nbsp;').join('\n')}</div>`;
  } else {
    const c = chunks[state.lyricsChunk];
    const align = song.align || 'center';
    const fsOverride = song.fontOverride ? LYRICS_FS_MAP[song.fontOverride] : '';
    body = `<div class="lines" style="text-align:${align};${fsOverride?('font-size:'+fsOverride+';'):''}">${c.map(h=>`<div>${h||'&nbsp;'}</div>`).join('')}</div>`;
  }

  let dots = '';
  if(chunks.length>1){
    dots = `<div class="dots">` + chunks.map((_,i)=>`<div class="dot ${i===state.lyricsChunk?'on':''}"></div>`).join('') + `</div>`;
  } else { dots = `<div></div>`; }

  const toggle = (hasLyrics || hasCifra || hasSheet) ? `<div class="modeToggle">
      <button class="btn small ${state.lyricsMode==='letra'?'active':''}" onclick="setLyricsMode('letra')">Letra</button>
      <button class="btn small ${state.lyricsMode==='cifra'?'active':''}" onclick="setLyricsMode('cifra')">Cifra</button>
      <button class="btn small ${state.lyricsMode==='partitura'?'active':''}" onclick="setLyricsMode('partitura')" title="Partitura">🎵</button>
    </div>` : '';

  const nt = nextTitle();
  const footerNext = nt ? `<div class="nextup">&gt;&gt; ${esc(nt)}</div>` : `<div class="nextup dim">Última música</div>`;

  el.innerHTML = `<div id="lyricsScreen">
    <div class="lyrheader">
      <div class="info">
        <div class="titleRow">
          <div class="t">${esc(song.title)}</div>
          ${song.tone ? `<div class="toneBadge">${esc(song.tone)}</div>` : ''}
        </div>
        <div class="sub">${esc(song.artist||'')}${song.bpm?' · '+esc(song.bpm)+' bpm':''} · Faixa ${posLabel}</div>
      </div>
      ${toggle}
    </div>
    <div class="lyrbody" id="lyrbody">
      ${body}
      <div class="zone left" onclick="lyricsPrev()"></div>
      <div class="zone right" onclick="lyricsNext()"></div>
    </div>
    <div class="lyrfooter">
      <div class="lyrfooter-left">
        <span>${chunks.length ? (state.lyricsChunk+1)+' / '+chunks.length : ''}</span>
        ${dots}
      </div>
      ${footerNext}
    </div>
  </div>`;

  if(state.lyricsMode==='cifra' && db.settings.chordFitPage && chunks.length){
    requestAnimationFrame(fitCifraToPage);
  }
  if(state.lyricsMode==='partitura' && hasSheet){
    loadPartituraIntoView(song);
  }
}
let sheetRequestToken = 0;
async function loadPartituraIntoView(song){
  const myToken = ++sheetRequestToken;
  revokeSheetBlobUrl();
  try{
    const rec = await idbGetSheetMusic(song.id);
    if(myToken !== sheetRequestToken) return; // navigated away meanwhile
    const wrap = document.getElementById('sheetWrap');
    if(!wrap) return;
    if(!rec || !rec.blob){ wrap.innerHTML = '<div class="noLyrics">Não consegui carregar a partitura.</div>'; return; }
    const url = URL.createObjectURL(rec.blob);
    currentSheetBlobUrl = url;
    if(rec.type==='pdf'){
      wrap.innerHTML = `<iframe src="${url}" class="sheetFrame" title="Partitura"></iframe>`;
    } else {
      wrap.innerHTML = `<img src="${url}" class="sheetImg" alt="Partitura">`;
    }
  }catch(err){
    if(myToken !== sheetRequestToken) return;
    const wrap = document.getElementById('sheetWrap');
    if(wrap) wrap.innerHTML = '<div class="noLyrics">Erro ao carregar a partitura.</div>';
  }
}
// Auto-shrinks the cifra block (never enlarges past the configured size) so the
// whole chord chart fits on screen at once, for the "página inteira" setting.
function fitCifraToPage(){
  const box = document.getElementById('lyrbody');
  const content = document.querySelector('.cifra-lines');
  if(!box || !content) return;
  content.style.fontSize = '';
  const cs = getComputedStyle(box);
  const padX = parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const availW = box.clientWidth - padX;
  const availH = box.clientHeight - padY;
  const baseSize = parseFloat(getComputedStyle(content).fontSize);
  const contentW = content.scrollWidth;
  const contentH = content.scrollHeight;
  if(!contentW || !contentH || availW<=0 || availH<=0) return;
  const scale = Math.min(availW/contentW, availH/contentH, 1) * 0.96;
  content.style.fontSize = Math.max(10, baseSize*scale) + 'px';
}
function truncate(s,n){ if(!s) return ''; return s.length>n? s.slice(0,n)+'…' : s; }
function nextTitle(){
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  if(!sl || state.stageIndex>=sl.songs.length-1) return '';
  const s = db.songs[sl.songs[state.stageIndex+1]];
  return s ? truncate(s.title, 40) : '';
}
function lyricsNext(){
  const song = currentSong(); if(!song) return;
  const chunks = activeChunks(song);
  if(state.lyricsChunk < chunks.length-1){ state.lyricsChunk++; render(); }
  else {
    const sl = db.setlists.find(s=>s.id===state.setlistId);
    if(state.stageIndex < sl.songs.length-1){ state.stageIndex++; state.lyricsChunk=0; render(); }
  }
}
function lyricsPrev(){
  if(state.lyricsChunk > 0){ state.lyricsChunk--; render(); }
  else {
    const sl = db.setlists.find(s=>s.id===state.setlistId);
    if(state.stageIndex > 0){
      state.stageIndex--;
      const song = currentSong();
      const chunks = activeChunks(song);
      state.lyricsChunk = Math.max(0, chunks.length-1);
      render();
    }
  }
}

function closeSettings(){ const el = document.getElementById('settingsOverlay'); if(el) el.remove(); }
function reopenSettings(){ closeSettings(); openSettings(); }
function cycleTheme(){
  const order = ['dark','mono','monolight'];
  const i = order.indexOf(db.settings.theme);
  db.settings.theme = order[(i+1)%order.length];
  saveDB(); applyTheme(); reopenSettings();
}
function changeLines(d){
  db.settings.linesPerPage = Math.max(1, Math.min(8, db.settings.linesPerPage+d));
  saveDB(); state.lyricsChunk=0; reopenSettings();
}
function stepScale(current, d){
  const order = ['sm','md','lg','xl'];
  let i = order.indexOf(current);
  i = Math.max(0, Math.min(order.length-1, i+d));
  return order[i];
}
function changeFontSize(d){
  db.settings.fontSize = stepScale(db.settings.fontSize, d);
  saveDB(); applyTheme(); reopenSettings();
}
function changeChordFontSize(d){
  db.settings.chordFontSize = stepScale(db.settings.chordFontSize, d);
  saveDB(); applyTheme(); reopenSettings();
}
function toggleChordFitPage(){
  db.settings.chordFitPage = !db.settings.chordFitPage;
  saveDB(); state.lyricsChunk=0; reopenSettings();
}
function changeStageFontSize(key, d){
  db.settings.stageFontSize[key] = stepScale(db.settings.stageFontSize[key], d);
  saveDB(); applyTheme(); reopenSettings();
}
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'setlist-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const incoming = JSON.parse(reader.result);
      if(!confirm('Importar irá SUBSTITUIR todos os dados atuais. Continuar?')) return;
      const ds = defaultSettings();
      db = Object.assign(defaultDB(), incoming);
      db.settings = Object.assign({}, ds, incoming.settings||{});
      db.settings.stageFontSize = Object.assign({}, ds.stageFontSize, (incoming.settings&&incoming.settings.stageFontSize)||{});
      // fill in any new song fields (align/cifra) missing from older backups —
      // build a fresh object per song, never merge a song into itself
      Object.keys(db.songs).forEach(sid=>{ db.songs[sid] = Object.assign(blankSong(), db.songs[sid]); });
      saveDB(); touchContent(); closeSettings(); goTo('setlists');
    }catch(e){ alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
}

/* ---------------- KEYBOARD / PEDAL CONTROLS ---------------- */
window.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  if(document.getElementById('settingsOverlay')) return;

  const NEXT = ['ArrowDown','ArrowRight','PageDown'];
  const PREV = ['ArrowUp','ArrowLeft','PageUp'];
  const SELECT = ['Enter',' '];
  const BACK = ['Escape','Backspace'];

  if(state.view==='stage'){
    if(NEXT.includes(e.key)){ e.preventDefault(); stageMove(1); }
    else if(PREV.includes(e.key)){ e.preventDefault(); stageMove(-1); }
    else if(SELECT.includes(e.key)){ e.preventDefault(); enterLyrics(); }
    else if(BACK.includes(e.key)){ e.preventDefault(); goTo('setlist'); }
  } else if(state.view==='lyrics'){
    if(NEXT.includes(e.key) || e.key===' '){ e.preventDefault(); lyricsNext(); }
    else if(PREV.includes(e.key)){ e.preventDefault(); lyricsPrev(); }
    else if(e.key==='Enter'){ e.preventDefault(); lyricsNext(); }
    else if(BACK.includes(e.key)){ e.preventDefault(); exitLyrics(); }
  } else if(state.view==='setlist'){
    if(BACK.includes(e.key)){ goTo('setlists'); }
  } else if(state.view==='setlists'){
    // no-op
  }
});

/* ---------------- SERVICE WORKER (offline install) ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------------- AUTO-SYNC (silent, only if configured) ---------------- */
(function(){
  const m = loadSyncMeta();
  if(m.token && m.repo) setTimeout(()=>runSync(false), 500);
})();
window.addEventListener('online', ()=>{
  const m = loadSyncMeta();
  if(m.token && m.repo) runSync(false);
});

/* ---------------- INIT ---------------- */
render();
</script>
