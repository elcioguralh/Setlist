<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Setlist Palco</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0a0a0a; --fg:#f2f0ea; --dim:#8a8880; --accent:#ffb100;
    --line:#28251f; --card:#151310; --danger:#ff4d4d; --radius:10px;
    --stage-fs:40px; --cifra-fs:28px; --ui-fs:17px;
    --stage-title-fs:26px; --stage-list-fs:16px; --stage-tone-fs:19px; --stage-notes-fs:15px;
  }
  html[data-theme="mono"]{
    --bg:#000000; --fg:#ffffff; --dim:#8f8f8f;
    --accent:#ffffff; --line:#2a2a2a; --card:#0d0d0d; --danger:#ffffff;
  }
  html[data-theme="monolight"]{
    --bg:#ffffff; --fg:#0a0a0a; --dim:#5c5c5c;
    --accent:#000000; --line:#dcdcdc; --card:#f3f3f1; --danger:#000000;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:var(--ui-fs); line-height:1.4;
    display:flex; flex-direction:column; height:100vh; height:100dvh;
    user-select:none;
  }
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(8px + env(safe-area-inset-top)) 16px 8px 16px;
    border-bottom:1px solid var(--line); flex-shrink:0; gap:8px;
  }
  #topbar h1{
    font-size:18px; font-weight:800; letter-spacing:-0.02em; margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .btn{
    background:none; border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:8px 12px; font-size:15px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .btn:active{ background:var(--card); }
  .btn.primary{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .btn.ghost{ border-color:transparent; padding:8px; }
  .btn.danger{ color:var(--danger); border-color:var(--danger); }
  .btn.small{ padding:5px 9px; font-size:12px; }
  .btn.active{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .topbtns{ display:flex; gap:6px; flex-shrink:0; }
  #screen{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  .empty{ padding:40px 24px; color:var(--dim); text-align:center; }
  .empty b{ color:var(--fg); display:block; margin-bottom:6px; font-size:17px; }

  /* Lists */
  .rowlist{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding:16px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .row:active{ background:var(--card); }
  .row .idx{ color:var(--dim); font-variant-numeric:tabular-nums; width:26px; flex-shrink:0; font-size:15px; }
  .row .info{ flex:1; min-width:0; }
  .row .info .t{ font-weight:700; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .info .a{ color:var(--dim); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .row .meta{ color:var(--dim); font-size:13px; flex-shrink:0; text-align:right; }
  .row .actions{ display:flex; gap:4px; flex-shrink:0; }
  .row.selected{ background:var(--card); box-shadow:inset 3px 0 0 var(--accent); }

  .fab-row{ display:flex; gap:8px; padding:16px; flex-wrap:wrap; }

  /* Forms */
  .form{ padding:16px; display:flex; flex-direction:column; gap:14px; }
  .field label{ display:block; font-size:13px; color:var(--dim); margin-bottom:6px; font-weight:600; }
  .field input, .field textarea, .field select{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:11px 12px; font-size:16px; font-family:inherit;
  }
  .field select{ -webkit-appearance:none; appearance:none; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field textarea.lyrics{ min-height:220px; font-size:15px; line-height:1.6; }
  .field textarea.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .hint{ color:var(--dim); font-size:13px; margin-top:-4px; }

  /* Stage view */
  #stageScreen{ display:flex; flex-direction:column; height:100%; }
  .stagelist{ flex:1; overflow-y:auto; }
  .stagerow{
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:5px;
  }
  .stagerow .main{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .stagerow .idx{ color:var(--dim); font-size:var(--stage-list-fs); width:24px; flex-shrink:0; }
  .stagerow .t{ font-size:var(--stage-title-fs); font-weight:800; flex:1; min-width:120px; overflow-wrap:break-word; }
  .stagerow .a{ color:var(--dim); font-size:var(--stage-list-fs); overflow-wrap:break-word; }
  .stagerow .tone{
    color:var(--bg); background:var(--accent); font-weight:800; font-size:var(--stage-tone-fs);
    flex-shrink:0; padding:1px 10px; border-radius:6px; line-height:1.35;
  }
  .stagerow .extra{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    padding-left:36px; font-size:var(--stage-notes-fs); color:var(--dim);
  }
  .stagerow .extra .bpm{ flex-shrink:0; }
  .stagerow .extra .notes{ color:var(--fg); opacity:0.85; overflow-wrap:break-word; }
  .stagerow.current{ background:var(--card); box-shadow:inset 5px 0 0 var(--accent); }
  .stagerow.current .t{ color:var(--accent); }

  /* Lyrics / Cifra view */
  #lyricsScreen{ display:flex; flex-direction:column; height:100%; }
  .lyrheader{ padding:6px 16px; border-bottom:1px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .lyrheader .info{ min-width:0; flex:1; }
  .titleRow{ display:flex; align-items:center; gap:8px; }
  .lyrheader .t{ font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .lyrheader .sub{ color:var(--dim); font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toneBadge{
    color:var(--bg); background:var(--accent); font-weight:800; font-size:var(--stage-tone-fs);
    padding:1px 10px; border-radius:6px; flex-shrink:0; line-height:1.35;
  }
  .modeToggle{ display:flex; gap:4px; flex-shrink:0; }
  .lyrbody{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:14px 24px; position:relative; overflow:hidden;
  }
  .lyrbody .lines{ font-size:var(--stage-fs); font-weight:700; line-height:1.5; letter-spacing:-0.01em; max-width:900px; overflow-wrap:break-word; }
  .lyrbody .lines div{ margin:0.15em 0; }
  .lyrbody .cifra-lines{
    font-size:var(--cifra-fs); font-weight:700; line-height:1.45; font-family:ui-monospace,Menlo,Consolas,monospace;
    white-space:pre; text-align:left; max-width:100%; overflow:auto;
  }
  .hl{ color:var(--accent); font-weight:900; }
  .lyrbody .zone{ position:absolute; top:0; bottom:0; width:50%; }
  .lyrbody .zone.left{ left:0; } .lyrbody .zone.right{ right:0; }
  .lyrfooter{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:3px 16px calc(3px + env(safe-area-inset-bottom)) 16px;
    border-top:1px solid var(--line); flex-shrink:0; color:var(--dim); font-size:11px;
  }
  .lyrfooter-left{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .dots{ display:flex; gap:4px; }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--line); }
  .dot.on{ background:var(--accent); }
  .nextup{
    font-size:14px; font-weight:800; color:var(--accent); text-align:right;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1;
  }
  .nextup.dim{ color:var(--dim); font-weight:600; font-size:11px; }
  .noLyrics{ color:var(--dim); font-size:20px; text-align:center; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet{
    background:var(--bg); border:1px solid var(--line); border-radius:16px 16px 0 0;
    width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)) 16px;
  }
  .sheet h2{ margin:0 0 14px 0; font-size:18px; }
  .sheet h3{ margin:18px 0 4px 0; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:0.03em; }
  .sheet-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap; }
  .sheet-row:last-child{ border-bottom:none; }
  .sheet-row.stack{ flex-direction:column; align-items:stretch; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{ width:34px; height:34px; border-radius:8px; flex-shrink:0; }
  .kbd{ display:inline-block; background:var(--card); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px; font-family:monospace; }
  .backupBtns{ display:flex; gap:8px; flex-wrap:wrap; }
  .backupBtns .btn{ flex:1; min-width:130px; }

  /* Responsive: landscape / very short viewports */
  @media (orientation:landscape) and (max-height:480px){
    #topbar{ padding-top:4px; padding-bottom:4px; }
    #topbar h1{ font-size:14px; }
    .stagerow{ padding:6px 16px; gap:2px; }
    .stagerow .extra{ padding-left:0; }
    .lyrheader{ padding:3px 16px; }
    .lyrheader .t{ font-size:13px; }
    .lyrheader .sub{ font-size:10px; }
    .lyrbody{ padding:4px 20px; }
    .lyrfooter{ padding:2px 16px; }
    .nextup{ font-size:12px; }
    .lyrbody .lines{ line-height:1.2; }
  }
  /* Responsive: wide screens (tablet / PC) */
  @media (min-width:680px){
    .form, .rowlist, .fab-row{ max-width:640px; margin:0 auto; width:100%; }
    .lyrbody .lines{ max-width:920px; }
    .lyrbody .cifra-lines{ max-width:920px; }
    .stagelist{ max-width:820px; margin:0 auto; width:100%; }
  }
</style>
</head>
<body>
<div id="topbar">
  <div class="topbtns" id="leftBtns"></div>
  <h1 id="title">Setlist Palco</h1>
  <div class="topbtns" id="rightBtns"></div>
</div>
<main id="screen"></main>

<script>
/* ---------------- DATA LAYER ---------------- */
const DB_KEY = 'setlistpalco_db_v1';
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function defaultSettings(){
  return {
    theme:'dark',
    linesPerPage:3, fontSize:'md',
    chordFontSize:'md', chordFitPage:false,
    stageFontSize:{ title:'md', list:'md', tone:'md', notes:'md' }
  };
}
function defaultDB(){
  return { setlists: [], songs: {}, settings: defaultSettings(), activeSetlistId:null };
}
let db = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultDB(), parsed);
    const ds = defaultSettings();
    merged.settings = Object.assign({}, ds, parsed.settings||{});
    merged.settings.stageFontSize = Object.assign({}, ds.stageFontSize, (parsed.settings&&parsed.settings.stageFontSize)||{});
    return merged;
  }catch(e){ return defaultDB(); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function blankSong(){ return { title:'', artist:'', tone:'', bpm:'', notes:'', lyrics:'', cifra:'', align:'' }; }

const LYRICS_FS_MAP = { sm:'30px', md:'40px', lg:'52px', xl:'66px' };
const CIFRA_FS_MAP  = { sm:'20px', md:'26px', lg:'32px', xl:'40px' };
const STAGE_TITLE_FS = { sm:'20px', md:'26px', lg:'34px', xl:'44px' };
const STAGE_LIST_FS  = { sm:'13px', md:'16px', lg:'20px', xl:'26px' };
const STAGE_TONE_FS  = { sm:'15px', md:'19px', lg:'26px', xl:'36px' };
const STAGE_NOTES_FS = { sm:'12px', md:'15px', lg:'19px', xl:'24px' };
const FS_LABELS = { sm:'Pequena', md:'Média', lg:'Grande', xl:'Extra grande' };

/* ---------------- STATE / NAV ---------------- */
let state = { view:'setlists', setlistId:null, editingSongId:null, stageIndex:0, lyricsChunk:0, lyricsMode:'letra' };

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Converts raw multi-line text into an array of per-line HTML strings, escaping
// each line and turning **destaque** into <strong class="hl">. Unlike a naive
// per-line regex, this tracks the bold state ACROSS line breaks: if you open **
// on one line and close it several lines later, every line in between is bold
// too (each line's own HTML stays valid/self-closed; the state just carries over
// to the next line's opening tag).
function processedLines(rawText, trimMode){
  const raw = (rawText||'').split('\n');
  let bold = false;
  const html = raw.map(rawLine=>{
    const line = trimMode==='trim' ? rawLine.trim() : rawLine.replace(/\s+$/,'');
    const e = esc(line);
    let out = bold ? '<strong class="hl">' : '';
    let i = 0;
    while(i < e.length){
      if(e.slice(i,i+2)==='**'){
        bold = !bold;
        out += bold ? '<strong class="hl">' : '</strong>';
        i += 2;
      } else {
        out += e[i]; i++;
      }
    }
    if(bold) out += '</strong>'; // keep this line's HTML self-contained; reopened on the next line
    return out;
  });
  // trim trailing blank lines (based on the actual trimmed raw content, not the html)
  while(html.length){
    const idx = html.length-1;
    const rawTrim = trimMode==='trim' ? raw[idx].trim() : raw[idx].replace(/\s+$/,'');
    if(rawTrim==='') html.pop(); else break;
  }
  return html;
}

/* ---------------- RENDER ROOT ---------------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', db.settings.theme==='dark' ? '' : db.settings.theme);
  const st = document.documentElement.style;
  st.setProperty('--stage-fs', LYRICS_FS_MAP[db.settings.fontSize]||'40px');
  st.setProperty('--cifra-fs', CIFRA_FS_MAP[db.settings.chordFontSize]||'26px');
  st.setProperty('--stage-title-fs', STAGE_TITLE_FS[db.settings.stageFontSize.title]||'26px');
  st.setProperty('--stage-list-fs', STAGE_LIST_FS[db.settings.stageFontSize.list]||'16px');
  st.setProperty('--stage-tone-fs', STAGE_TONE_FS[db.settings.stageFontSize.tone]||'19px');
  st.setProperty('--stage-notes-fs', STAGE_NOTES_FS[db.settings.stageFontSize.notes]||'15px');
}

function render(){
  applyTheme();
  const left = document.getElementById('leftBtns');
  const right = document.getElementById('rightBtns');
  const title = document.getElementById('title');
  left.innerHTML=''; right.innerHTML='';

  const settingsBtn = `<button class="btn ghost" onclick="openSettings()" aria-label="Ajustes">⚙</button>`;

  if(state.view==='setlists'){
    title.textContent='Meus Setlists';
    right.innerHTML = settingsBtn;
    renderSetlists();
  } else if(state.view==='setlist'){
    const sl = db.setlists.find(s=>s.id===state.setlistId);
    title.textContent = sl ? sl.name : 'Setlist';
    left.innerHTML = `<button class="btn ghost" onclick="goTo('setlists')">← Voltar</button>`;
    right.innerHTML = (sl && sl.songs.length ? `<button class="btn primary" onclick="enterStage(0)">▶ Palco</button>` : '') + settingsBtn;
    renderSetlist(sl);
  } else if(state.view==='songEdit'){
    title.textContent = state.editingSongId ? 'Editar música' : 'Nova música';
    left.innerHTML = `<button class="btn ghost" onclick="goTo('setlist')">Cancelar</button>`;
    right.innerHTML = `<button class="btn primary" onclick="saveSongForm()">Salvar</button>`;
    renderSongEdit();
  } else if(state.view==='paste'){
    title.textContent='Colar músicas';
    left.innerHTML = `<button class="btn ghost" onclick="goTo('setlist')">Cancelar</button>`;
    right.innerHTML = `<button class="btn primary" onclick="processPaste()">Adicionar</button>`;
    renderPaste();
  } else if(state.view==='stage'){
    const sl = db.setlists.find(s=>s.id===state.setlistId);
    title.textContent = sl ? sl.name : '';
    left.innerHTML = `<button class="btn ghost" onclick="goTo('setlist')">← Sair</button>`;
    right.innerHTML = settingsBtn;
    renderStage(sl);
  } else if(state.view==='lyrics'){
    renderLyrics();
    title.textContent='';
    left.innerHTML = `<button class="btn ghost" onclick="exitLyrics()">← Palco</button>`;
    right.innerHTML = settingsBtn;
  }
}

function goTo(view){ state.view=view; render(); }

/* ---------------- SETLISTS SCREEN ---------------- */
function renderSetlists(){
  const el = document.getElementById('screen');
  if(db.setlists.length===0){
    el.innerHTML = `<div class="empty"><b>Nenhum setlist ainda</b>Crie um setlist para o seu show.</div>
    <div class="fab-row"><button class="btn primary" onclick="createSetlist()">+ Novo setlist</button></div>`;
    return;
  }
  let html = `<div class="fab-row"><button class="btn primary" onclick="createSetlist()">+ Novo setlist</button></div><div class="rowlist">`;
  db.setlists.forEach(sl=>{
    html += `<div class="row" onclick="openSetlist('${sl.id}')">
      <div class="info"><div class="t">${esc(sl.name)}</div><div class="a">${sl.songs.length} música${sl.songs.length!==1?'s':''}</div></div>
      <div class="actions">
        <button class="btn ghost" onclick="event.stopPropagation(); duplicateSetlist('${sl.id}')" aria-label="Duplicar">⧉</button>
        <button class="btn ghost" onclick="event.stopPropagation(); renameSetlist('${sl.id}')">✎</button>
        <button class="btn ghost" onclick="event.stopPropagation(); deleteSetlist('${sl.id}')">🗑</button>
      </div></div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}
function createSetlist(){
  const name = prompt('Nome do setlist (ex: Show Bar do Zé - 20/09):');
  if(!name) return;
  const sl = { id:uid(), name:name.trim(), songs:[] };
  db.setlists.push(sl); saveDB();
  openSetlist(sl.id);
}
function renameSetlist(id){
  const sl = db.setlists.find(s=>s.id===id); if(!sl) return;
  const name = prompt('Novo nome:', sl.name);
  if(!name) return;
  sl.name = name.trim(); saveDB(); render();
}
function duplicateSetlist(id){
  const sl = db.setlists.find(s=>s.id===id); if(!sl) return;
  const suggested = sl.name + ' (cópia)';
  const name = prompt('Nome do novo setlist:', suggested);
  if(!name) return;
  const copy = { id:uid(), name:name.trim(), songs:[...sl.songs] };
  db.setlists.push(copy); saveDB();
  openSetlist(copy.id);
}
function deleteSetlist(id){
  if(!confirm('Excluir este setlist? As músicas cadastradas continuam salvas na biblioteca.')) return;
  db.setlists = db.setlists.filter(s=>s.id!==id); saveDB(); render();
}
function openSetlist(id){ state.setlistId=id; goTo('setlist'); }

/* ---------------- SETLIST (SONG LIST) SCREEN ---------------- */
function renderSetlist(sl){
  const el = document.getElementById('screen');
  if(!sl){ el.innerHTML=`<div class="empty">Setlist não encontrado.</div>`; return; }
  let html = `<div class="fab-row">
    <button class="btn" onclick="editSong(null)">+ Adicionar música</button>
    <button class="btn" onclick="goTo('paste')">+ Colar do Spotify</button>
    <button class="btn" onclick="duplicateSetlist('${sl.id}')">⧉ Duplicar setlist</button>
  </div>`;
  if(sl.songs.length===0){
    html += `<div class="empty"><b>Setlist vazio</b>Adicione músicas manualmente ou cole uma lista copiada do Spotify.</div>`;
  } else {
    html += `<div class="rowlist">`;
    sl.songs.forEach((songId, i)=>{
      const s = db.songs[songId]; if(!s) return;
      html += `<div class="row" onclick="editSong('${s.id}')">
        <div class="idx">${i+1}</div>
        <div class="info"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist||'')}</div></div>
        <div class="meta">${s.tone?esc(s.tone):''}${s.bpm?' · '+esc(s.bpm)+' bpm':''}</div>
        <div class="actions">
          <button class="btn ghost" onclick="event.stopPropagation(); moveSong('${sl.id}',${i},-1)">↑</button>
          <button class="btn ghost" onclick="event.stopPropagation(); moveSong('${sl.id}',${i},1)">↓</button>
          <button class="btn ghost" onclick="event.stopPropagation(); removeFromSetlist('${sl.id}',${i})">✕</button>
        </div></div>`;
    });
    html += `</div>`;
  }
  el.innerHTML = html;
}
function moveSong(slId, i, dir){
  const sl = db.setlists.find(s=>s.id===slId); if(!sl) return;
  const j = i+dir; if(j<0||j>=sl.songs.length) return;
  [sl.songs[i], sl.songs[j]] = [sl.songs[j], sl.songs[i]];
  saveDB(); render();
}
function removeFromSetlist(slId, i){
  const sl = db.setlists.find(s=>s.id===slId); if(!sl) return;
  sl.songs.splice(i,1); saveDB(); render();
}

/* ---------------- SONG EDIT SCREEN ---------------- */

}

      <div class="hint">A Cifra fica numa tela separada da Letra no modo Palco, com um botão para alternar entre as duas. Também aceita **destaque**.</div>
    </div>

    ${state.editingSongId ? `<button class="btn danger" onclick="deleteSongFromLibrary()">Excluir música</button>` : ''}
  </div>`;

function saveSongForm(){
  const title = document.getElementById('f_title').value.trim();
  if(!title){ alert('Digite o título da música.'); return; }
  const data = {
    title,
    artist: document.getElementById('f_artist').value.trim(),
    tone: document.getElementById('f_tone').value.trim(),
    bpm: document.getElementById('f_bpm').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    lyrics: document.getElementById('f_lyrics').value,
    align: document.getElementById('f_align').value,
    cifra: document.getElementById('f_cifra').value
  };
  let id = state.editingSongId;
  if(id){ db.songs[id] = Object.assign(blankSong(), db.songs[id], data); }
  else {
    id = uid();
    db.songs[id] = Object.assign(blankSong(), {id}, data);
    const sl = db.setlists.find(s=>s.id===state.setlistId);
    if(sl) sl.songs.push(id);
  }
  saveDB();
  goTo('setlist');
}
function deleteSongFromLibrary(){
  if(!confirm('Excluir esta música da biblioteca? Ela será removida de todos os setlists.')) return;
  const id = state.editingSongId;
  delete db.songs[id];
  db.setlists.forEach(sl=>{ sl.songs = sl.songs.filter(sid=>sid!==id); });
  saveDB();
  goTo('setlist');
}

/* ---------------- PASTE FROM SPOTIFY ---------------- */
function renderPaste(){
  document.getElementById('screen').innerHTML = `<div class="form">
    <div class="field">
      <label>Cole aqui a lista copiada do Spotify (ou qualquer lista de músicas, uma por linha)</label>
      <textarea id="pasteBox" class="lyrics" placeholder="No Spotify: selecione as músicas da playlist, clique com o botão direito &gt; Copiar. Depois cole aqui."></textarea>
    </div>
    <div class="hint">Cada linha vira uma música. Se a linha tiver "Título - Artista" ou vier separada por tabulação (como o Spotify copia), o app separa título e artista automaticamente.</div>
  </div>`;
}
function processPaste(){
  const raw = document.getElementById('pasteBox').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0){ alert('Cole ao menos uma linha.'); return; }
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  let added = 0;
  lines.forEach(line=>{
    if(/^#?\s*(title|título|artista|album|álbum|duration|duração)\s*$/i.test(line)) return;
    let title, artist='';
    if(line.includes('\t')){
      const parts = line.split('\t').map(p=>p.trim()).filter(Boolean);
      title = parts[0]; artist = parts[1] || '';
    } else if(line.includes(' - ')){
      const idx = line.indexOf(' - ');
      title = line.slice(0, idx).trim();
      artist = line.slice(idx+3).trim();
    } else if(line.includes(' – ')){
      const idx = line.indexOf(' – ');
      title = line.slice(0, idx).trim();
      artist = line.slice(idx+3).trim();
    } else {
      title = line;
    }
    if(!title) return;
    const id = uid();
    db.songs[id] = Object.assign(blankSong(), { id, title, artist });
    sl.songs.push(id);
    added++;
  });
  saveDB();
  goTo('setlist');
  setTimeout(()=>{ if(added) alert(added+' música(s) adicionada(s). Abra cada uma para colar a letra, se quiser.'); }, 50);
}

/* ---------------- STAGE VIEW ---------------- */
function enterStage(index){
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  if(!sl || sl.songs.length===0) return;
  state.stageIndex = Math.max(0, Math.min(index, sl.songs.length-1));
  goTo('stage');
}
function renderStage(sl){
  const el = document.getElementById('screen');
  if(!sl || sl.songs.length===0){ el.innerHTML=`<div class="empty">Setlist vazio.</div>`; return; }
  let html = `<div id="stageScreen"><div class="stagelist" id="stagelist">`;
  sl.songs.forEach((songId,i)=>{
    const s = db.songs[songId]; if(!s) return;
    const hasExtra = s.bpm || s.notes;
    html += `<div class="stagerow ${i===state.stageIndex?'current':''}" data-i="${i}" onclick="stageRowClick(${i})">
      <div class="main">
        <div class="idx">${i+1}</div>
        <div class="t">${esc(s.title)}</div>
        <div class="a">${esc(s.artist||'')}</div>
        ${s.tone?`<div class="tone">${esc(s.tone)}</div>`:''}
      </div>
      ${hasExtra ? `<div class="extra">
        ${s.bpm?`<span class="bpm">${esc(s.bpm)} bpm</span>`:''}
        ${s.notes?`<span class="notes">${esc(s.notes)}</span>`:''}
      </div>` : ''}
    </div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  const row = el.querySelector('.stagerow.current');
  if(row) row.scrollIntoView({block:'center'});
}
function stageRowClick(i){
  if(i===state.stageIndex){ enterLyrics(); return; }
  state.stageIndex=i; render();
}
function stageMove(dir){
  const sl = db.setlists.find(s=>s.id===state.setlistId); if(!sl) return;
  const n = sl.songs.length;
  state.stageIndex = ((state.stageIndex+dir)%n+n)%n;
  render();
}

/* ---------------- LYRICS / CIFRA VIEW ---------------- */
function enterLyrics(){
  state.lyricsChunk=0;
  const song = currentSongForSetlist();
  if(song && !song.lyrics && song.cifra) state.lyricsMode='cifra';
  else state.lyricsMode='letra';
  goTo('lyrics');
}
function exitLyrics(){ goTo('stage'); }
function currentSongForSetlist(){
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  if(!sl) return null;
  return db.songs[sl.songs[state.stageIndex]];
}
function currentSong(){ return currentSongForSetlist(); }

// Letra: each line trimmed (normal lyric formatting); blank trailing lines collapsed.
function lyricsChunks(song){
  const linesHtml = processedLines(song.lyrics, 'trim');
  if(linesHtml.length===0) return [];
  const perPage = db.settings.linesPerPage || 3;
  const chunks = [];
  for(let i=0;i<linesHtml.length;i+=perPage) chunks.push(linesHtml.slice(i,i+perPage));
  return chunks;
}
// Cifra: only trailing whitespace per line is trimmed — leading/internal spaces are
// preserved exactly as pasted, since that's what keeps chords aligned over the lyrics.
// If "página inteira" is on, the whole cifra is returned as a single chunk (no paging).
function chordChunks(song){
  const linesHtml = processedLines(song.cifra, 'trailing');
  if(linesHtml.length===0) return [];
  if(db.settings.chordFitPage) return [linesHtml];
  const perPage = db.settings.linesPerPage || 3;
  const chunks = [];
  for(let i=0;i<linesHtml.length;i+=perPage) chunks.push(linesHtml.slice(i,i+perPage));
  return chunks;
}
function activeChunks(song){ return state.lyricsMode==='cifra' ? chordChunks(song) : lyricsChunks(song); }

function setLyricsMode(mode){
  if(state.lyricsMode===mode) return;
  state.lyricsMode = mode; state.lyricsChunk = 0; render();
}

function renderLyrics(){
  const song = currentSong();
  const el = document.getElementById('screen');
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  if(!song){ el.innerHTML=`<div class="empty">Música não encontrada.</div>`; return; }

  const hasLyrics = !!(song.lyrics && song.lyrics.trim());
  const hasCifra = !!(song.cifra && song.cifra.trim());
  const chunks = activeChunks(song);
  state.lyricsChunk = Math.max(0, Math.min(state.lyricsChunk, Math.max(chunks.length-1,0)));
  const posLabel = `${state.stageIndex+1}/${sl.songs.length}`;

  let body;
  if(chunks.length===0){
    const msg = state.lyricsMode==='cifra' ? 'Sem cifra cadastrada para esta música.' : 'Sem letra cadastrada para esta música.';
    body = `<div class="noLyrics">${msg}${song.notes?`<br><br><span style="font-size:16px">${esc(song.notes)}</span>`:''}</div>`;
  } else if(state.lyricsMode==='cifra'){
    const c = chunks[state.lyricsChunk];
    body = `<div class="cifra-lines">${c.map(h=>h||'&nbsp;').join('\n')}</div>`;
  } else {
    const c = chunks[state.lyricsChunk];
    const align = song.align || 'center';
    body = `<div class="lines" style="text-align:${align}">${c.map(h=>`<div>${h||'&nbsp;'}</div>`).join('')}</div>`;
  }

  let dots = '';
  if(chunks.length>1){
    dots = `<div class="dots">` + chunks.map((_,i)=>`<div class="dot ${i===state.lyricsChunk?'on':''}"></div>`).join('') + `</div>`;
  } else { dots = `<div></div>`; }

  const toggle = (hasLyrics || hasCifra) ? `<div class="modeToggle">
      <button class="btn small ${state.lyricsMode==='letra'?'active':''}" onclick="setLyricsMode('letra')">Letra</button>
      <button class="btn small ${state.lyricsMode==='cifra'?'active':''}" onclick="setLyricsMode('cifra')">Cifra</button>
    </div>` : '';

  const nt = nextTitle();
  const footerNext = nt ? `<div class="nextup">&gt;&gt; ${esc(nt)}</div>` : `<div class="nextup dim">Última música</div>`;

  el.innerHTML = `<div id="lyricsScreen">
    <div class="lyrheader">
      <div class="info">
        <div class="titleRow">
          <div class="t">${esc(song.title)}</div>
          ${song.tone ? `<div class="toneBadge">${esc(song.tone)}</div>` : ''}
        </div>
        <div class="sub">${esc(song.artist||'')}${song.bpm?' · '+esc(song.bpm)+' bpm':''} · Faixa ${posLabel}</div>
      </div>
      ${toggle}
    </div>
    <div class="lyrbody" id="lyrbody">
      ${body}
      <div class="zone left" onclick="lyricsPrev()"></div>
      <div class="zone right" onclick="lyricsNext()"></div>
    </div>
    <div class="lyrfooter">
      <div class="lyrfooter-left">
        <span>${chunks.length ? (state.lyricsChunk+1)+' / '+chunks.length : ''}</span>
        ${dots}
      </div>
      ${footerNext}
    </div>
  </div>`;

  if(state.lyricsMode==='cifra' && db.settings.chordFitPage && chunks.length){
    requestAnimationFrame(fitCifraToPage);
  }
}
// Auto-shrinks the cifra block (never enlarges past the configured size) so the
// whole chord chart fits on screen at once, for the "página inteira" setting.
function fitCifraToPage(){
  const box = document.getElementById('lyrbody');
  const content = document.querySelector('.cifra-lines');
  if(!box || !content) return;
  content.style.fontSize = '';
  const cs = getComputedStyle(box);
  const padX = parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const availW = box.clientWidth - padX;
  const availH = box.clientHeight - padY;
  const baseSize = parseFloat(getComputedStyle(content).fontSize);
  const contentW = content.scrollWidth;
  const contentH = content.scrollHeight;
  if(!contentW || !contentH || availW<=0 || availH<=0) return;
  const scale = Math.min(availW/contentW, availH/contentH, 1) * 0.96;
  content.style.fontSize = Math.max(10, baseSize*scale) + 'px';
}
function truncate(s,n){ if(!s) return ''; return s.length>n? s.slice(0,n)+'…' : s; }
function nextTitle(){
  const sl = db.setlists.find(s=>s.id===state.setlistId);
  if(!sl || state.stageIndex>=sl.songs.length-1) return '';
  const s = db.songs[sl.songs[state.stageIndex+1]];
  return s ? truncate(s.title, 40) : '';
}
function lyricsNext(){
  const song = currentSong(); if(!song) return;
  const chunks = activeChunks(song);
  if(state.lyricsChunk < chunks.length-1){ state.lyricsChunk++; render(); }
  else {
    const sl = db.setlists.find(s=>s.id===state.setlistId);
    if(state.stageIndex < sl.songs.length-1){ state.stageIndex++; state.lyricsChunk=0; render(); }
  }
}
function lyricsPrev(){
  if(state.lyricsChunk > 0){ state.lyricsChunk--; render(); }
  else {
    const sl = db.setlists.find(s=>s.id===state.setlistId);
    if(state.stageIndex > 0){
      state.stageIndex--;
      const song = currentSong();
      const chunks = activeChunks(song);
      state.lyricsChunk = Math.max(0, chunks.length-1);
      render();
    }
  }
}

/* ---------------- SETTINGS SHEET ---------------- */
function openSettings(){
  const themeLabels = {dark:'Escuro', mono:'Monocromático (preto/branco)', monolight:'Monocromático claro'};
  const sfs = db.settings.stageFontSize;
  const stageRow = (key, label) => `
      <div class="sheet-row"><span>${label}</span>
        <div class="stepper">
          <button class="btn" onclick="changeStageFontSize('${key}',-1)">A−</button>
          <span>${FS_LABELS[sfs[key]]}</span>
          <button class="btn" onclick="changeStageFontSize('${key}',1)">A+</button>
        </div>
      </div>`;

  const html = `<div class="overlay" onclick="if(event.target===this) closeSettings()">
    <div class="sheet">
      <h2>Ajustes</h2>
      <div class="sheet-row"><span>Tema</span>
        <button class="btn" onclick="cycleTheme()">${themeLabels[db.settings.theme]}</button>
      </div>
      <div class="sheet-row"><span>Linhas por tela (letra / cifra)</span>
        <div class="stepper">
          <button class="btn" onclick="changeLines(-1)">−</button>
          <b>${db.settings.linesPerPage}</b>
          <button class="btn" onclick="changeLines(1)">+</button>
        </div>
      </div>
      <div class="sheet-row"><span>Tamanho da letra</span>
        <div class="stepper">
          <button class="btn" onclick="changeFontSize(-1)">A−</button>
          <span>${FS_LABELS[db.settings.fontSize]}</span>
          <button class="btn" onclick="changeFontSize(1)">A+</button>
        </div>
      </div>
      <div class="sheet-row"><span>Tamanho da cifra</span>
        <div class="stepper">
          <button class="btn" onclick="changeChordFontSize(-1)">A−</button>
          <span>${FS_LABELS[db.settings.chordFontSize]}</span>
          <button class="btn" onclick="changeChordFontSize(1)">A+</button>
        </div>
      </div>
      <div class="sheet-row"><span>Cifra: página inteira (ajusta tamanho sozinho)</span>
        <button class="btn ${db.settings.chordFitPage?'active':''}" onclick="toggleChordFitPage()">${db.settings.chordFitPage?'Ativado':'Desativado'}</button>
      </div>

      <h3>Modo Palco — tamanhos individuais</h3>
      ${stageRow('title','Nome da música')}
      ${stageRow('list','Artista / lista')}
      ${stageRow('tone','Tonalidade')}
      ${stageRow('notes','Notas do show')}

      <div class="sheet-row stack">
        <span style="font-weight:600;">Backup</span>
        <div class="backupBtns">
          <button class="btn" onclick="exportData()">⬇ Exportar (salvar arquivo)</button>
          <button class="btn" onclick="document.getElementById('importFile').click()">⬆ Importar (carregar arquivo)</button>
        </div>
      </div>

      <div class="sheet-row" style="flex-direction:column; align-items:flex-start; gap:6px;">
        <span style="font-weight:600;">Controles (teclado / pedal Bluetooth)</span>
        <div class="hint" style="margin:0;">
          <span class="kbd">↓</span> <span class="kbd">→</span> <span class="kbd">Page Down</span> — próximo &nbsp;
          <span class="kbd">↑</span> <span class="kbd">←</span> <span class="kbd">Page Up</span> — anterior<br><br>
          <span class="kbd">Enter</span> <span class="kbd">Espaço</span> — abrir letra / avançar trecho<br><br>
          <span class="kbd">Esc</span> <span class="kbd">Backspace</span> — voltar
        </div>
      </div>
      <div style="padding-top:10px;"><button class="btn" style="width:100%" onclick="closeSettings()">Fechar</button></div>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">`;
  const wrap = document.createElement('div');
  wrap.id='settingsOverlay';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
}
function closeSettings(){ const el = document.getElementById('settingsOverlay'); if(el) el.remove(); }
function reopenSettings(){ closeSettings(); openSettings(); }
function cycleTheme(){
  const order = ['dark','mono','monolight'];
  const i = order.indexOf(db.settings.theme);
  db.settings.theme = order[(i+1)%order.length];
  saveDB(); applyTheme(); reopenSettings();
}
function changeLines(d){
  db.settings.linesPerPage = Math.max(1, Math.min(8, db.settings.linesPerPage+d));
  saveDB(); state.lyricsChunk=0; reopenSettings();
}
function stepScale(current, d){
  const order = ['sm','md','lg','xl'];
  let i = order.indexOf(current);
  i = Math.max(0, Math.min(order.length-1, i+d));
  return order[i];
}
function changeFontSize(d){
  db.settings.fontSize = stepScale(db.settings.fontSize, d);
  saveDB(); applyTheme(); reopenSettings();
}
function changeChordFontSize(d){
  db.settings.chordFontSize = stepScale(db.settings.chordFontSize, d);
  saveDB(); applyTheme(); reopenSettings();
}
function toggleChordFitPage(){
  db.settings.chordFitPage = !db.settings.chordFitPage;
  saveDB(); state.lyricsChunk=0; reopenSettings();
}
function changeStageFontSize(key, d){
  db.settings.stageFontSize[key] = stepScale(db.settings.stageFontSize[key], d);
  saveDB(); applyTheme(); reopenSettings();
}
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'setlist-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const incoming = JSON.parse(reader.result);
      if(!confirm('Importar irá SUBSTITUIR todos os dados atuais. Continuar?')) return;
      const ds = defaultSettings();
      db = Object.assign(defaultDB(), incoming);
      db.settings = Object.assign({}, ds, incoming.settings||{});
      db.settings.stageFontSize = Object.assign({}, ds.stageFontSize, (incoming.settings&&incoming.settings.stageFontSize)||{});
      // fill in any new song fields (align/cifra) missing from older backups —
      // build a fresh object per song, never merge a song into itself
      Object.keys(db.songs).forEach(sid=>{ db.songs[sid] = Object.assign(blankSong(), db.songs[sid]); });
      saveDB(); closeSettings(); goTo('setlists');
    }catch(e){ alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
}

/* ---------------- KEYBOARD / PEDAL CONTROLS ---------------- */
window.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  if(document.getElementById('settingsOverlay')) return;

  const NEXT = ['ArrowDown','ArrowRight','PageDown'];
  const PREV = ['ArrowUp','ArrowLeft','PageUp'];
  const SELECT = ['Enter',' '];
  const BACK = ['Escape','Backspace'];

  if(state.view==='stage'){
    if(NEXT.includes(e.key)){ e.preventDefault(); stageMove(1); }
    else if(PREV.includes(e.key)){ e.preventDefault(); stageMove(-1); }
    else if(SELECT.includes(e.key)){ e.preventDefault(); enterLyrics(); }
    else if(BACK.includes(e.key)){ e.preventDefault(); goTo('setlist'); }
  } else if(state.view==='lyrics'){
    if(NEXT.includes(e.key) || e.key===' '){ e.preventDefault(); lyricsNext(); }
    else if(PREV.includes(e.key)){ e.preventDefault(); lyricsPrev(); }
    else if(e.key==='Enter'){ e.preventDefault(); lyricsNext(); }
    else if(BACK.includes(e.key)){ e.preventDefault(); exitLyrics(); }
  } else if(state.view==='setlist'){
    if(BACK.includes(e.key)){ goTo('setlists'); }
  } else if(state.view==='setlists'){
    // no-op
  }
});

/* ---------------- SERVICE WORKER (offline install) ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------------- INIT ---------------- */
render();
